[project]
name = "signals-analyze"
version = "0.1.0"
description = "LLM-driven analysis: hypothesis scoring, source reliability, embeddings"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "signals-core",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "trafilatura>=1.12.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "vercel-blob-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
signals-core = { workspace = true }
vercel-blob-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signals_analyze"]
