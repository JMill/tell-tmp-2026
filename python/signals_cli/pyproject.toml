[project]
name = "signals-cli"
version = "0.1.0"
description = "Typer CLI aggregator for the signals pipeline"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "signals-core",
    "signals-ingest",
    "signals-methods",
    "signals-analyze",
]

[project.scripts]
signals = "signals_cli.__main__:app"

[tool.uv.sources]
signals-core = { workspace = true }
signals-ingest = { workspace = true }
signals-methods = { workspace = true }
signals-analyze = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signals_cli"]
