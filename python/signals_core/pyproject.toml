[project]
name = "signals-core"
version = "0.1.0"
description = "Shared pydantic data models for the TELL weak-signal detection pipeline"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-ulid>=3.0.0",
    "rich>=13.0.0",
    "trafilatura>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signals_core"]
