# Feb 2023 High-Altitude Objects — Seed URL List
#
# Starting points for the retrospective corpus ingestion. The batch ingester
# (signals ingest batch) reads this file, iterates each entry, and pipelines
# it through the appropriate adapter.
#
# Schema (per entry):
#   url:         the canonical URL to fetch
#   source_kind: gov | news | social | academic | aviation | forum | podcast | other
#   adapter:     which ingest adapter to use (wayback | direct)
#   event_date:  approximate date of the event the URL documents (YYYY-MM-DD)
#   narratives:  list of narrative tags this URL relates to (see narratives.yaml)
#   notes:       optional free-text
#
# All URLs below were surfaced via the research pass documented in
# research/2026-04-19-verified-events.md. Each corresponds to at least one
# canonical event in timeline.yaml.
#
# Adapter routing convention:
#   - direct  for gov sources and stable PDF permalinks
#   - wayback for tier-1 news to stabilize against paywall and content drift
#
# Host migrations to be aware of:
#   - defense.gov -> war.gov (mid-2025 rebrand; Article IDs stable)
#   - whitehouse.gov (Biden era) -> bidenwhitehouse.archives.gov

metadata:
  corpus: high-altitude-objects-2023
  last_updated: 2026-04-19
  compiled_from: research/2026-04-19-verified-events.md + web search expansion
  authored_by: Claude (draft for JMill review)

